site_name: IssunDB Documentation
site_description: A fast embedded graph database in Rust
repo_url: https://github.com/IssunDB/issun-db
repo_name: IssunDB/issun-db
site_url: https://issundb.github.io/issun-db/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.top
    - content.code.select
    - content.code.annotate
    - navigation.tracking

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/IssunDB/issun-db

plugins:
  - search

hooks:
  # Adds a "Run in the playground" link under each Cypher block marked `<!-- playground -->`.
  - docs/hooks/playground_links.py

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Examples: examples.md
  - Cypher Support: cypher.md
  - API Reference: api-reference.md
  - Hybrid Retrieval: hybrid-retrieval.md
  - Python Integration: python.md
  - Other Integrations: integrations.md
  - Playground: https://issundb.github.io/issun-db/playground/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - attr_list
  - toc:
      permalink: true
