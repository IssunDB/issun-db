<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IssunDB Playground</title>
    <meta
      name="description"
      content="Run IssunDB, an embedded graph database with vector and full-text search, entirely in your browser. The whole engine is compiled to WebAssembly; nothing is sent to a server."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="./logo.svg" />
    <script>
      // Applied before first paint, so a dark-theme visitor never sees a white flash. The
      // attribute name and its two values are Material for MkDocs' own, so the playground
      // and the surrounding documentation are switched by the same vocabulary.
      (function () {
        var scheme = null;
        try {
          scheme = localStorage.getItem("issundb.scheme");
        } catch (e) {}
        if (!scheme) {
          scheme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "slate"
            : "default";
        }
        document.documentElement.setAttribute("data-md-color-scheme", scheme);
      })();
    </script>
  </head>
  <body>
    <div class="boot" id="boot">
      <div class="sp"></div>
      <div>Loading the engine…</div>
      <div style="font-size: 12px; opacity: 0.7">
        An 8&nbsp;MB WebAssembly module. It runs in this tab; no server is involved.
      </div>
    </div>

    <header>
      <button class="hdr icon" id="toggle-side" title="Toggle the sidebar" aria-label="Toggle the sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" />
        </svg>
      </button>
      <div class="brand">
        <img class="brand-logo" src="./logo.svg" alt="IssunDB logo" width="26" height="26" />
        <span class="brand-name">IssunDB <span class="brand-sub">Playground</span></span>
      </div>
      <div class="spacer"></div>
      <nav class="site-nav">
        <a href="../">Docs</a>
        <a href="https://github.com/IssunDB/issun-db" target="_blank" rel="noopener">GitHub</a>
      </nav>
      <button class="hdr icon" id="scheme" title="Switch between light and dark" aria-label="Switch between light and dark">
        <svg id="scheme-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"></svg>
      </button>
    </header>

    <div class="shell">
      <div class="wrap">
        <aside id="side">
          <section class="panel" aria-labelledby="setup-title">
            <h2 id="setup-title">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
                <line x1="12" y1="22.08" x2="12" y2="12" />
              </svg>
              Setup
            </h2>
            <div class="panel-body">
              <div class="field">
                <label for="sample-graph">Pick a Graph</label>
                <select id="sample-graph" class="control"></select>
              </div>
              <div class="btn-row">
                <button class="btn accent" id="load-sample" title="Put this sample's CREATE in the editor">
                  Load Graph
                </button>
                <button class="btn" id="reset" title="Discard all data and re-seed with this sample">
                  Reset Database
                </button>
              </div>
              <div class="field-label">Schema</div>
              <div id="schema"></div>
            </div>
          </section>

          <section class="panel" aria-labelledby="demos-title">
            <h2 id="demos-title">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                <polygon points="12 2 2 7 12 12 22 7 12 2" />
                <polyline points="2 17 12 22 22 17" />
                <polyline points="2 12 12 17 22 12" />
              </svg>
              Examples
            </h2>
            <div class="panel-body">
              <div class="field">
                <label for="demo-category">Category</label>
                <select id="demo-category" class="control"></select>
              </div>
              <div class="demo-buttons" id="demo-buttons"></div>
              <a class="docs-link" id="category-docs" href="#" target="_blank" rel="noopener"></a>
            </div>
          </section>

          <section class="panel" aria-labelledby="procs-title">
            <h2 id="procs-title">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                <polyline points="16 18 22 12 16 6" />
                <polyline points="8 6 2 12 8 18" />
              </svg>
              Procedures
            </h2>
            <div class="panel-body">
              <div class="field">
                <input
                  id="proc-search"
                  class="control"
                  type="search"
                  placeholder="Search 13 procedures…"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="Search procedures"
                />
              </div>
              <div class="proc-list" id="proc-list"></div>
            </div>
          </section>

          <section class="panel" aria-labelledby="history-title">
            <h2 id="history-title">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <polyline points="12 7 12 12 16 14" />
              </svg>
              Query History
            </h2>
            <div class="panel-body" id="history"></div>
          </section>
        </aside>

        <main>
          <section class="card" aria-label="Cypher editor">
            <div class="card-head">
              <h3>Cypher Editor</h3>
              <span class="hint">Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run</span>
            </div>
            <div class="editor" id="editor-box">
              <pre aria-hidden="true"><code id="highlight"></code></pre>
              <textarea
                id="editor"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                aria-label="Cypher query"
              ></textarea>
            </div>
            <div class="card-foot">
              <button class="btn" id="format" title="Tidy the query's line breaks and keyword casing (Shift+Alt+F)">
                <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                  <line x1="3" y1="6" x2="21" y2="6" />
                  <line x1="3" y1="12" x2="15" y2="12" />
                  <line x1="3" y1="18" x2="18" y2="18" />
                </svg>
                Format
              </button>
              <button class="btn" id="clear" title="Empty the editor">
                <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
                Clear
              </button>
              <button class="btn" id="share" title="Copy a link that reproduces this query">
                <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                </svg>
                Share Link
              </button>
              <button class="btn" id="explain" title="Show the physical plan instead of running">
                <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                  <line x1="9" y1="6" x2="21" y2="6" />
                  <line x1="5" y1="12" x2="21" y2="12" />
                  <line x1="9" y1="18" x2="21" y2="18" />
                </svg>
                Explain
              </button>
              <button class="btn primary" id="run">
                <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.5" fill="none" aria-hidden="true">
                  <polygon points="5 3 19 12 5 21 5 3" />
                </svg>
                Execute Query
              </button>
            </div>
          </section>

          <div class="banner" id="status" role="status" aria-live="polite"></div>

          <section class="card results" aria-label="Query results">
            <div class="card-head tabs" role="tablist">
              <button class="tab" role="tab" data-pane="table" aria-controls="pane-table" aria-selected="true">
                <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                  <line x1="3" y1="9" x2="21" y2="9" />
                  <line x1="9" y1="9" x2="9" y2="21" />
                </svg>
                Table View
              </button>
              <button class="tab" role="tab" data-pane="graph" aria-controls="pane-graph" aria-selected="false">
                <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                  <circle cx="18" cy="5" r="3" />
                  <circle cx="6" cy="12" r="3" />
                  <circle cx="18" cy="19" r="3" />
                  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                  <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                </svg>
                Graph Visualization
              </button>
              <button class="tab" role="tab" data-pane="plan" aria-controls="pane-plan" aria-selected="false">
                Plan
              </button>
              <button class="tab" role="tab" data-pane="json" aria-controls="pane-json" aria-selected="false">
                JSON
              </button>
              <div class="spacer"></div>
              <button class="btn sm" id="csv" title="Download the result as CSV">CSV</button>
              <button class="btn sm" id="json-dl" title="Download the result as JSON">JSON</button>
            </div>

            <div class="result-meta" id="result-meta">Run a query to view results.</div>

            <div class="panes">
              <div class="pane on" id="pane-table" role="tabpanel"></div>

              <div class="pane graph-pane" id="pane-graph" role="tabpanel">
                <div class="graph-toolbar">
                  <span id="graph-count"></span>
                  <div class="legend" id="legend"></div>
                  <div class="spacer"></div>
                  <button class="btn sm" id="zoom-out" title="Zoom out" aria-label="Zoom out">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" aria-hidden="true">
                      <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                  </button>
                  <button class="btn sm" id="zoom-in" title="Zoom in" aria-label="Zoom in">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" aria-hidden="true">
                      <line x1="12" y1="5" x2="12" y2="19" />
                      <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                  </button>
                  <button class="btn sm" id="fit" title="Zoom the view to the drawn graph">Fit</button>
                  <button class="btn sm" id="relayout">Re-layout</button>
                </div>
                <svg class="graph" id="svg"></svg>
                <div class="inspect" id="inspect" hidden></div>
              </div>

              <div class="pane" id="pane-plan" role="tabpanel"></div>
              <div class="pane" id="pane-json" role="tabpanel"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <footer>
      <span id="powered"></span>
      <div class="spacer"></div>
      <span id="footer-note"></span>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
