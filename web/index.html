<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IssunDB Playground</title>
    <meta
      name="description"
      content="Run IssunDB, an embedded graph database with vector and full-text search, entirely in your browser. The whole engine is compiled to WebAssembly; nothing is sent to a server."
    />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237e56c2'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='19' font-weight='bold' fill='white' text-anchor='middle'%3E一%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint, so a dark-theme visitor never sees a white flash. The
      // attribute name and its two values are Material for MkDocs' own, so the playground
      // and the surrounding documentation are switched by the same vocabulary.
      (function () {
        var scheme = null;
        try {
          scheme = localStorage.getItem("issundb.scheme");
        } catch (e) {}
        if (!scheme) {
          scheme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "slate"
            : "default";
        }
        document.documentElement.setAttribute("data-md-color-scheme", scheme);
      })();
    </script>
  </head>
  <body>
    <div class="boot" id="boot">
      <div class="sp"></div>
      <div>Loading the engine…</div>
      <div style="font-size: 12px; opacity: 0.7">
        An 8&nbsp;MB WebAssembly module. It runs in this tab; no server is involved.
      </div>
    </div>

    <header>
      <button class="hdr" id="toggle-side" title="Toggle the sidebar" aria-label="Toggle the sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" />
        </svg>
      </button>
      <div class="brand">
        <span class="mark">一</span>
        <span>IssunDB</span>
        <small id="version"></small>
      </div>
      <span class="badge" id="build-badge">in-memory build</span>
      <div class="spacer"></div>
      <button class="hdr" id="share" title="Copy a link that reproduces this query">Share</button>
      <button class="hdr" id="reset" title="Discard all data and re-seed the sample graph">
        Reset
      </button>
      <button class="hdr" id="scheme" title="Switch between light and dark" aria-label="Switch between light and dark">
        <svg id="scheme-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"></svg>
      </button>
      <a class="hdr" href="../" title="Back to the documentation">Docs</a>
      <a class="hdr" href="https://github.com/IssunDB/issun-db" target="_blank" rel="noopener">
        GitHub
      </a>
    </header>

    <div class="shell">
      <aside id="side">
        <section class="panel" aria-labelledby="demos-title">
          <h2 id="demos-title">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
              <polygon points="12 2 2 7 12 12 22 7 12 2" />
              <polyline points="2 17 12 22 22 17" />
              <polyline points="2 12 12 17 22 12" />
            </svg>
            Demos
          </h2>
          <div class="panel-body">
            <div class="field">
              <label for="demo-category">Category</label>
              <select id="demo-category" class="control"></select>
            </div>
            <p class="hint" id="category-blurb"></p>
            <div class="demo-buttons" id="demo-buttons"></div>
            <a class="docs-link" id="category-docs" href="#" target="_blank" rel="noopener"></a>
          </div>
        </section>

        <section class="panel" aria-labelledby="schema-title">
          <h2 id="schema-title">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
              <ellipse cx="12" cy="5" rx="9" ry="3" />
              <path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5" />
              <path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3" />
            </svg>
            Schema
          </h2>
          <div class="panel-body" id="schema"></div>
        </section>

        <section class="panel" aria-labelledby="history-title">
          <h2 id="history-title">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <polyline points="12 7 12 12 16 14" />
            </svg>
            History
          </h2>
          <div class="panel-body" id="history"></div>
        </section>
      </aside>

      <main>
        <div class="editor-wrap">
          <div class="desc" id="desc"></div>
          <div class="editor" id="editor-box">
            <pre aria-hidden="true"><code id="highlight"></code></pre>
            <textarea
              id="editor"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="off"
              aria-label="Cypher query"
            ></textarea>
          </div>
          <div class="bar">
            <button class="run" id="run">Run <kbd>⌘↵</kbd></button>
            <button class="ghost" id="explain" title="Show the physical plan instead of running">
              Explain
            </button>
            <button class="ghost" id="load-sample" title="Insert the sample social graph">
              Sample
            </button>
            <div class="status" id="status"></div>
          </div>
        </div>

        <div class="results">
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" data-pane="table" aria-controls="pane-table" aria-selected="true">
              Table <span class="c" id="tab-rows">0</span>
            </button>
            <button class="tab" role="tab" data-pane="graph" aria-controls="pane-graph" aria-selected="false">Graph</button>
            <button class="tab" role="tab" data-pane="plan" aria-controls="pane-plan" aria-selected="false">Plan</button>
            <button class="tab" role="tab" data-pane="json" aria-controls="pane-json" aria-selected="false">JSON</button>
            <div class="spacer"></div>
            <button class="ghost" id="csv" title="Download the result as CSV">CSV</button>
            <button class="ghost" id="json-dl" title="Download the result as JSON">JSON</button>
          </div>

          <div class="pane on" id="pane-table" role="tabpanel"></div>

          <div class="pane graph-pane" id="pane-graph" role="tabpanel">
            <div class="graph-toolbar">
              <span id="graph-count"></span>
              <div class="legend" id="legend"></div>
              <div class="spacer"></div>
              <label style="display: inline-flex; align-items: center; gap: 5px">
                <input type="checkbox" id="size-by-rank" />
                size by PageRank
              </label>
              <button class="ghost" id="relayout">Re-layout</button>
            </div>
            <svg class="graph" id="svg"></svg>
            <div class="inspect" id="inspect" hidden></div>
          </div>

          <div class="pane" id="pane-plan" role="tabpanel"></div>
          <div class="pane" id="pane-json" role="tabpanel"></div>
        </div>
      </main>
    </div>

    <footer>
      <span>
        The whole engine runs in this tab, compiled to WebAssembly. Nothing leaves your browser.
      </span>
      <div class="spacer"></div>
      <span id="footer-note"></span>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
