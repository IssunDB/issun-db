[package]
name = "issundb"
description = "IssunDB's main crate; it exposes the public API for IssunDB"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
issundb-core.workspace = true
issundb-cypher.workspace = true
issundb-vector.workspace = true
issundb-text.workspace = true
issundb-retrieval.workspace = true
serde_json = "1"

[features]
default = ["hnsw", "lmdb"]
hnsw = [
    "issundb-vector/hnsw",
    "issundb-cypher/hnsw",
    "issundb-retrieval/hnsw",
]
# Forwarded to the storage backend selection in `issundb-core`. Every crate between
# here and core has to relay it, and each of their workspace declarations carries
# `default-features = false`, or a sibling silently re-enables LMDB for the whole
# graph. Verify with `cargo tree -p issundb --no-default-features | grep lmdb`,
# which must print nothing.
lmdb = [
    "issundb-core/lmdb",
    "issundb-vector/lmdb",
    "issundb-text/lmdb",
    "issundb-cypher/lmdb",
    "issundb-retrieval/lmdb",
]

[dev-dependencies]
tempfile.workspace = true
rmp-serde.workspace = true
serde.workspace = true
walkdir.workspace = true
gherkin.workspace = true
serde_json.workspace = true
criterion.workspace = true

[[bench]]
name = "query_optimizer"
harness = false

[[bench]]
name = "skewed_schema"
harness = false

[[bench]]
name = "profile_query"
harness = false

[[bench]]
name = "profile_triangle"
harness = false

[[bench]]
name = "cyclic_enumeration"
harness = false
