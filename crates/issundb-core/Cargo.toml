[package]
name = "issundb-core"
description = "IssunDB's storage engine and core data structures"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
ahash = { workspace = true }
heed = { workspace = true, optional = true }
byteorder.workspace = true
zerocopy.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
thiserror.workspace = true
tracing.workspace = true
rust-stemmers.workspace = true
unicode-segmentation.workspace = true
deepsize.workspace = true

# See the `ahash` note in the workspace `Cargo.toml`: `runtime-rng` is re-enabled off
# wasm, and left off for wasm so `getrandom` stays out of that build.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ahash = { workspace = true, features = ["runtime-rng"] }

[features]
default = ["lmdb"]
# The persistent storage backend. On by default; turning it off selects the
# in-memory backend in `storage::memory`, which is what a target with no libc can
# compile (LMDB is C and is a memory-mapped file). See `storage/mod.rs`.
lmdb = ["dep:heed"]

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
criterion.workspace = true
rand.workspace = true
serde_json.workspace = true

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "pokec"
harness = false

[[bench]]
name = "wiki_pagerank"
harness = false

[[bench]]
name = "write_throughput"
harness = false

[[bin]]
name = "gen_testdata"
path = "src/bin/gen_testdata.rs"
