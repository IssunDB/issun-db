[package]
name = "issundb-retrieval"
description = "Hybrid retrieval (vector, text, and graph) for IssunDB"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
autobenches = false

[dependencies]
ahash = { workspace = true }
issundb-core.workspace = true
issundb-vector.workspace = true
issundb-text.workspace = true
thiserror.workspace = true

# See the `ahash` note in the workspace `Cargo.toml`: `runtime-rng` is re-enabled off
# wasm, and left off for wasm so `getrandom` stays out of that build.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ahash = { workspace = true, features = ["runtime-rng"] }

[features]
default = ["hnsw", "lmdb"]
hnsw = ["issundb-vector/hnsw"]
lmdb = ["issundb-core/lmdb", "issundb-vector/lmdb", "issundb-text/lmdb"]

[dev-dependencies]
tempfile.workspace = true
serde_json = "1"
criterion.workspace = true
parquet.workspace = true
arrow-array.workspace = true

[[bench]]
name = "hybrid_retrieval"
harness = false

[[bench]]
name = "graphrag_retrieval"
harness = false

[[bench]]
name = "se_hybrid_retrieval"
harness = false
