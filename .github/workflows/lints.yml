name: Run Linter Checks

on:
  workflow_dispatch:
  schedule: # Run every day at midnight (UTC)
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --no-update-lock-file -c bash -euo pipefail {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check GitHub workflows
        run: actionlint

      - name: Check formatting
        run: make format-check

      - name: Run linters
        run: make lint

      - name: Run linters against the non-default backends
        run: make lint-backends

      - name: Check the rustdoc
        run: make doc-check
