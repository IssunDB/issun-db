name: Run Tests

on:
  workflow_dispatch:
  schedule: # Run every day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_call:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

#concurrency:
#  group: ${{ github.workflow }}-${{ github.ref }}
#  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#stable --no-update-lock-file -c bash -euo pipefail {0}
    env:
      OMP_NUM_THREADS: 1
      NEXTEST_RETRIES: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Download test datasets (for integration and E2E tests)
        run: |
          uv sync --frozen --extra dev
          source .venv/bin/activate
          make testdata
        continue-on-error: true

      - name: Run tests and generate coverage report
        run: make coverage

      - name: Run doctests
        run: make doctest

      - name: Run CLI integration tests
        run: make test-cli

      - name: Run openCypher TCK conformance tests
        env:
          ISSUNDB_CONFORMANCE: '1'
          ISSUNDB_CONFORMANCE_MAX_FAILURES: '1'
        run: cargo test -p issundb --test conformance -- --nocapture

      - name: Run the suites against the non-default storage and vector backends
        run: make test-backends

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
        continue-on-error: true

  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#msrv --no-update-lock-file -c bash -euo pipefail {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check that the workspace compiles on the MSRV
        run: cargo check --workspace --all-targets --locked
