name: Publish to Crates.io

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  call_tests:
    uses: ./.github/workflows/tests.yml

  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --no-update-lock-file -c bash -euo pipefail {0}

    needs: call_tests
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Publish crates to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import sys, json; m = json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"] == "issundb"))')"
          for crate in issundb-core issundb-vector issundb-text issundb-retrieval issundb-cypher issundb; do
            prefix_dir="$(printf '%s' "$crate" | cut -c1-2)/$(printf '%s' "$crate" | cut -c3-4)"
            if curl -sf "https://index.crates.io/$prefix_dir/$crate" | grep -qF "\"vers\":\"$version\""; then
              echo "Skipping $crate ($version already on crates.io)..."
              continue
            fi
            echo "Publishing $crate..."
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"
          done
